spring.application.name=cats
spring.datasource.url=jdbc:mysql://localhost:3306/cats?useSSL=false&serverTimezone=Asia/Singapore&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:cats_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Course fee claim attachments
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=24MB
spring.servlet.multipart.resolve-lazily=true
cats.claims.upload-directory=${CATS_CLAIM_UPLOAD_DIRECTORY:./uploads/claims}
spring.jpa.show-sql=true
spring.thymeleaf.cache=false
