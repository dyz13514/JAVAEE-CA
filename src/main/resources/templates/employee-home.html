<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Home - CATS</title>
  </head>
  <body>
    <h1 th:text="'Welcome, ' + ${session.loggedInUser.name}">Welcome</h1>
    <div
      th:if="${successMessage}"
      th:text="${successMessage}"
      style="
        background-color: #d4edda;
        color: #155724;
        padding: 10px;
        border-radius: 4px;
      "
    ></div>
    <div
      th:if="${errorMessage}"
      th:text="${errorMessage}"
      style="color: red"
    ></div>

    <p>This is the CATS home page.</p>
    <p>
      <a th:href="@{/employee/apply}">Apply for a Course</a> |
      <a th:href="@{/employee/history}">My Course History</a>
    </p>
    <p>
      <a th:href="@{/entitlements}">View Annual Entitlement</a>
    </p>
    <p th:if="${session.loggedInUser.role.name() == 'MANAGER'}">
      <a th:href="@{/manager/approvals}">Review Subordinate Applications</a>
    </p>
  </body>
</html>
