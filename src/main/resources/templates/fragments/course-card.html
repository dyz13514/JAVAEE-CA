<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<article th:fragment="card(course)" class="course-card">
<p th:text="${course.category.name}"></p><h2 th:text="${course.title}"></h2>
<p th:text="${course.provider.name}"></p><p th:text="${course.introduction}"></p>
<p>Reference Fee (S$): <span th:text="${course.fee}"></span></p>
<a th:href="@{/employee/courses/{id}(id=${course.id})}">View Details</a>
<a th:if="${canApply}" th:href="@{/employee/apply(commonCourseId=${course.id})}">Use for Application</a>
</article></body></html>
