<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Commonly Attended Courses - CATS</title>
<th:block th:replace="~{fragments/layout :: assets}"></th:block></head>
<body><th:block th:replace="~{fragments/layout :: shell('browse-courses')}"></th:block>
<main class="page-main admin-content">
<h1>Commonly Attended Courses</h1>
<p>Use a catalogue entry to prefill an application, or enter your own course.</p>
<p th:if="${canApply}"><a class="primary-button" th:href="@{/employee/apply}">Apply for Any Course</a></p>
<p th:if="${successMessage != null}" th:text="${successMessage}"></p>
<p role="alert" th:if="${errorMessage != null}" th:text="${errorMessage}"></p>
<th:block th:replace="~{fragments/course-filter :: filter('/employee/courses')}"></th:block>
<p th:text="${#lists.size(courses) + ' courses found'}"></p>
<div class="catalogue-grid"><th:block th:each="course : ${courses}">
<article th:replace="~{fragments/course-card :: card(${course})}"></article>
</th:block></div>
</main></body></html>
