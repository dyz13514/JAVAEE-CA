<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle + ' - CATS'}">Course fee claims - CATS</title>
    <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/layout :: shell(${activeNavigation})}"></th:block>
<main class="page-main admin-content">
    <div class="page-heading">
        <div>
            <h1 th:text="${pageTitle}">Course fee claims</h1>
            <p>Course fee reimbursement after completion of an approved External Course or Professional Certification.</p>
        </div>
        <a th:if="${canSubmit}" class="primary-button" th:href="@{/employee/claims/new}">Submit claim</a>
    </div>

    <p role="status" th:if="${successMessage != null}" th:text="${successMessage}"></p>
    <p role="alert" th:if="${errorMessage != null}" th:text="${errorMessage}"></p>
    <p><a th:href="@{/training-ledger}">View training ledger</a></p>
    <p th:if="${#lists.isEmpty(claims)}">No course fee claims found.</p>

    <div class="table-scroll">
        <table th:if="${!#lists.isEmpty(claims)}">
            <thead>
            <tr>
                <th>Claim ID</th>
                <th>Employee</th>
                <th>Course</th>
                <th>Claim amount</th>
                <th>Status</th>
                <th>Submitted at</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="claim : ${claims}">
                <td th:text="${claim.id}"></td>
                <td th:text="${claim.application.employee.name}"></td>
                <td th:text="${claim.application.courseTitle}"></td>
                <td th:text="${'S$ ' + #numbers.formatDecimal(claim.amount, 1, 'COMMA', 2, 'POINT')}"></td>
                <td><span th:replace="~{fragments/layout :: status(${claim.status.name()})}"></span></td>
                <td th:text="${#temporals.format(claim.submittedAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td><a th:href="@{/claims/{id}(id=${claim.id})}">View claim</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
