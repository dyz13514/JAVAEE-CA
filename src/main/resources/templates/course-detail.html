<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Course Details - CATS</title>
<th:block th:replace="~{fragments/layout :: assets}"></th:block></head>
<body><th:block th:replace="~{fragments/layout :: shell('browse-courses')}"></th:block>
<main class="page-main admin-content">
<h1 th:text="${course.title}"></h1>
<p>Category: <span th:text="${course.category.name}"></span></p>
<p th:text="${course.category.description}"></p>
<p>Half-day Allowed: <span th:text="${course.category.halfDayAllowed ? 'Yes' : 'No'}"></span></p>
<p>Training Provider: <span th:text="${course.provider.name}"></span></p>
<p>Reference Fee (S$): <span th:text="${course.fee}"></span></p><p th:text="${course.introduction}"></p>
<p>Enter your own training dates and actual fee in the application.</p>
<a th:if="${canApply}" th:href="@{/employee/apply(commonCourseId=${course.id})}">Use for Application</a>
<a th:href="@{/employee/courses}">Back to Catalogue</a>
</main></body></html>
