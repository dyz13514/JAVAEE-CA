<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Course view - CATS</title>
    <th:block th:replace="~{fragments/layout :: assets}"></th:block>
    <link rel="stylesheet" th:href="@{/css/course-view.css(v='f9650b575b')}" href="/css/course-view.css?v=f9650b575b"></head>
<body><th:block th:replace="~{fragments/layout :: shell('calendar')}"></th:block>
<main class="page-main calendar-page course-view-page">
    <div class="page-heading"><div><h1 th:text="${session.loggedInUser.role.name() == 'ADMIN' ? 'Training records' : 'Team training'}">Training records</h1><p>Applications, review status and training dates.</p></div></div>
    <nav th:replace="~{fragments/navigation :: team('records')}"></nav>
    <form class="portal-context" method="get" th:action="@{/course-view}" th:if="${!#lists.isEmpty(employees)}">
        <input type="hidden" name="others" value="true">
        <label for="record-employee">Employee</label><select id="record-employee" name="employeeId" required>
            <option value="">Select an employee</option><option th:each="employee : ${employees}" th:value="${employee.id}" th:selected="${employee.id == selectedEmployeeId}" th:text="${employee.name}"></option>
        </select><button type="submit">View training</button>
    </form>
    <p role="alert" th:if="${errorMessage}" th:text="${errorMessage}" class="notice error"></p>
    <section th:if="${selectedEmployee != null}">
        <h2 th:text="${selectedEmployee.name}"></h2>

        <div th:replace="~{fragments/pagination :: search}"></div>
        <p th:if="${#lists.isEmpty(applications)}">No matching course applications.</p>
        <div class="calendar-scroll" th:unless="${#lists.isEmpty(applications)}">
            <table class="course-view-table">
                <colgroup><col class="course-column"><col class="provider-column"><col class="date-column"><col class="date-column"><col class="status-column"></colgroup>
                <thead><tr><th scope="col">Course</th><th scope="col">Provider</th><th scope="col">Start</th><th scope="col">End</th><th scope="col">Status</th></tr></thead>
                <tbody><tr th:each="courseApplication : ${applications}">
                    <td><a th:if="${ownCourses}" th:href="@{/employee/history/{id}(id=${courseApplication.id})}" class="course-entry secondary-button"><span th:text="${courseApplication.courseTitle}"></span>
                            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 4 4 4-4 4"/></svg></a>
                        <span th:unless="${ownCourses}" th:text="${courseApplication.courseTitle}"></span></td>
                    <td class="provider-cell" th:text="${courseApplication.providerName}"></td><td class="date-cell" th:text="${courseApplication.fromDate}"></td><td class="date-cell" th:text="${courseApplication.toDate}"></td>
                    <td><span th:replace="~{fragments/layout :: status(${courseApplication.status})}"></span></td>
                </tr></tbody></table>
        </div>
        <div th:replace="~{fragments/pagination :: navigation}"></div>
    </section>
    <section th:if="${selectedEmployee == null and errorMessage == null}">
        <h2>Select an employee</h2>
        <p th:if="${#lists.isEmpty(employees)}">No employees to display.</p>
        <div class="calendar-scroll" th:unless="${#lists.isEmpty(employees)}"><table class="course-view-table"><thead><tr><th scope="col">Name</th><th scope="col">Username</th><th scope="col">Role</th></tr></thead>
            <tbody><tr th:each="employee : ${employees}"><td><a th:href="@{/course-view(employeeId=${employee.id})}" th:text="${employee.name}" class="record-link"></a></td>
                <td th:text="${employee.username}"></td><td th:text="${employee.role}"></td></tr></tbody></table></div>
    </section>
</main></body></html>
