<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<title>Staff sign in - CATS</title>
<th:block th:replace="~{fragments/layout :: assets}">
</th:block>
</head>
<body class="login-page">
<header class="login-header">
<a class="wordmark" th:href="@{/login}">CATS</a>
<span>NUS-ISS</span>
</header>
<main class="login-main">
<section class="login-intro">
<h1>Make room<br>for learning.</h1>
<p>Course Application Tracking System</p>
<p>Apply for training. Keep your progress in view.</p>
</section>
<section class="login-form" aria-labelledby="login-title">
<h2 id="login-title">Sign in</h2>
<nav class="role-tabs" aria-label="Login account type">
<a class="active" aria-current="page" th:href="@{/employee/login}">Employee / Manager</a>
<a class=""  th:href="@{/admin/login}">Administrator</a>
</nav>
<div th:if="${errorMessage}" th:text="${errorMessage}" class="error" role="alert">
</div>
<form th:action="@{/employee/login}" action="/employee/login" method="post">
<div class="field">
<label for="username">Username</label>
<input id="username" name="username" autocomplete="username" required>
</div>
<div class="field">
<label for="password">Password</label>
<input type="password" id="password" name="password" autocomplete="current-password" required>
</div>
<button class="primary-button" type="submit">Sign in</button>
</form>
<p class="login-help">Forgot your password? Contact your administrator.</p>
</section>
</main>
<footer class="login-footer">
<span>NUS-ISS staff training</span>
<span>Account access is provided by your administrator.</span>
</footer>
</body>
</html>
