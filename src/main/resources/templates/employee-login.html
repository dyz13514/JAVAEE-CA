<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee / Manager Login - CATS</title>
    <style th:inline="css">
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: Arial, Helvetica, sans-serif;
            color: #253044;
            background-color: #e8edf1;
            background-image: linear-gradient(rgba(255, 255, 255, .36), rgba(255, 255, 255, .36)), url(/*[[@{/images/employee-login-background.png}]]*/ '/images/employee-login-background.png');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }
        .login-card { width: 100%; max-width: 400px; padding: 32px; background: #fff; border: 1px solid #e1e5ea; border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, .10); }
        .brand { margin: 0 0 12px; color: #0039a6; font-size: 14px; font-weight: 700; }
        h1 { margin: 0 0 28px; font-size: 24px; line-height: 1.3; font-weight: 600; }
        .field { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; }
        input { display: block; width: 100%; height: 44px; padding: 10px 12px; border: 1px solid #cbd2da; border-radius: 4px; font: inherit; font-size: 16px; background: #fff; color: #253044; }
        input:focus-visible { outline: 2px solid #0039a6; outline-offset: 1px; }
        .help { margin: -4px 0 24px; font-size: 13px; line-height: 1.5; color: #697586; }
        .sign-in { width: 100%; min-height: 44px; border: 0; border-radius: 4px; background: #0039a6; color: #fff; font: inherit; font-size: 15px; cursor: pointer; }
        .sign-in:hover { background: #002b80; }
        a { color: #526174; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
        a:hover { color: #0039a6; }
        a:focus-visible, button:focus-visible { outline: 2px solid #0039a6; outline-offset: 4px; }
        .footer { margin: 24px 0 0; text-align: center; }
        .error { padding: 12px; margin-bottom: 20px; border: 1px solid #e8b5b5; border-radius: 4px; background: #fff5f5; color: #9b2727; font-size: 14px; line-height: 1.4; }
        @media (max-width: 400px) { .login-card { padding: 24px; } h1 { font-size: 22px; } }
    </style>
</head>
<body>
    <main class="login-card" aria-labelledby="login-title">
        <p class="brand">CATS</p>
        <h1 id="login-title">Employee / Manager Login</h1>
        <div th:if="${errorMessage}" th:text="${errorMessage}" class="error" role="alert">Invalid username or password</div>
        <form th:action="@{/employee/login}" action="/employee/login" method="post">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <p class="help">Forgot your password? Call +65 12345678.</p>
            <button type="submit" class="sign-in">Sign In</button>
        </form>
        <p class="footer"><a href="/login" th:href="@{/login}">Back to login options</a></p>
    </main>
</body>
</html>
