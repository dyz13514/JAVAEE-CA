<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to CATS</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #fff; color: #000; font-family: Arial, Helvetica, sans-serif; }
        .login-layout { display: grid; grid-template-columns: 45% 55%; min-height: 100vh; }
        .artwork { margin: 0; padding: 0 20px; height: 100vh; }
        .artwork img { display: block; width: 100%; height: 100%; object-fit: contain; }
        .login-panel { padding: clamp(40px, 7vh, 84px) 32px 64px; text-align: center; }
        h1 { max-width: 760px; margin: 0 auto; color: #0039a6; font-size: clamp(28px, 2.3vw, 44px); line-height: 1.2; font-weight: 700; }
        h2 { width: min(100%, 340px); margin: 48px auto 36px; font-size: 36px; line-height: 1.2; text-align: left; }
        .login-options { display: flex; flex-direction: column; gap: 36px; width: min(100%, 340px); margin: 0 auto; }
        .login-link { display: flex; justify-content: center; align-items: center; min-height: 52px; padding: 8px 16px; border: 2px solid #0039a6; border-radius: 11px; color: #0039a6; background: #fff; font-size: clamp(22px, 1.6vw, 30px); line-height: 1.2; text-decoration: none; transition: background-color .15s, color .15s; }
        .login-link.primary { color: #fff; background: #0039a6; }
        .login-link:hover { background: #edf3ff; }
        .login-link.primary:hover { background: #002b80; border-color: #002b80; }
        .login-link:focus-visible { outline: 3px solid #f0a000; outline-offset: 5px; }
        @media (max-width: 700px) {
            .login-layout { grid-template-columns: 1fr; }
            .artwork { height: 42vh; padding: 16px; }
            .login-panel { padding: 24px 24px 48px; }
            h1 { font-size: 28px; }
            h2 { margin: 24px auto; font-size: 30px; }
            .login-options { gap: 24px; }
            .login-link { font-size: 24px; }
        }
    </style>
</head>
<body>
    <main class="login-layout">
        <figure class="artwork">
            <img src="/images/cats-all-star.png" th:src="@{/images/cats-all-star.png}"
                 alt="CATS All Star collage of cats">
        </figure>
        <section class="login-panel" aria-labelledby="welcome-title">
            <h1 id="welcome-title">Welcome to Course Application<br>Tracking System(CATS)!&nbsp; !&nbsp; !</h1>
            <h2>Login</h2>
            <nav class="login-options" aria-label="Choose your login">
                <a class="login-link primary" href="/employee/login" th:href="@{/employee/login}">Employee/Manager</a>
                <a class="login-link" href="/admin/login" th:href="@{/admin/login}">Admin</a>
            </nav>
        </section>
    </main>
</body>
</html>
