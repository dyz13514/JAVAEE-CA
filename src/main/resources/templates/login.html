<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome - CATS</title>
<th:block th:replace="~{fragments/layout :: assets}">
</th:block>
</head>
<body class="login-page">
<header class="login-header">
<a class="wordmark" th:href="@{/login}">CATS</a>
<span>NUS-ISS</span>
</header>
<main class="login-main">
<section class="login-intro">
<h1>Make room<br>for learning.</h1>
<p>Course Application Tracking System</p>
<p>Apply for training. Keep your progress in view.</p>
</section>
<section class="login-form" aria-labelledby="login-title">
<h2 id="login-title">Welcome to CATS</h2>
<nav class="login-options" aria-label="Choose your login">
<a class="primary-button" th:href="@{/employee/login}">Employee / Manager</a>
<a class="primary-button secondary" th:href="@{/admin/login}">Administrator</a>
</nav>
<p class="login-help">Sign in with your assigned account.</p>
</section>
</main>
<footer class="login-footer">
<span>NUS-ISS staff training</span>
<span>Account access is provided by your administrator.</span>
</footer>
</body>
</html>
