<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
<th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/layout :: shell('employees')}"></th:block>
<main class="page-main admin-content">

<div class="page-heading"><h1>Employee Management</h1><a class="primary-button" th:href="@{/admin/employees/new}">Add Employee</a></div>

<p role="status" th:if="${successMessage != null}"
   th:text="${successMessage}">
</p>

<p role="alert" th:if="${errorMessage != null}"
   th:text="${errorMessage}">
</p>

<p th:if="${#lists.isEmpty(employees)}">
    No employees found.
</p>

<div class="table-scroll"><table th:if="${!#lists.isEmpty(employees)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Designation</th>
        <th>Supervisor</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="employee : ${employees}">
        <td th:text="${employee.id}"></td>
        <td th:text="${employee.username}"></td>
        <td th:text="${employee.name}"></td>
        <td th:text="${employee.email == null ? 'Not configured' : employee.email}"></td>
        <td th:text="${employee.role.name() == 'REGULAR_STAFF' ? 'Staff' : #strings.capitalize(#strings.toLowerCase(employee.role.name()))}"></td>
        <td th:text="${employee.designation != null ? #strings.capitalize(#strings.toLowerCase(employee.designation.name())) : 'Not assigned'}"></td>

        <td th:text="${employee.supervisor == null
                      ? 'Not assigned'
                      : employee.supervisor.name}">
        </td>

        <td>
            <a th:href="@{/admin/employees/{id}/edit(id=${employee.id})}">
                Edit
            </a>

            <form th:action="@{/admin/employees/{id}/delete(id=${employee.id})}"
                  method="post"
                  onsubmit="return confirm('Are you sure you want to delete this employee?');">

                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table></div>

</main>
</body>
</html>
