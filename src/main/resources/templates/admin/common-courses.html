<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Common Course Catalogue - CATS</title>
<th:block th:replace="~{fragments/layout :: assets}"></th:block></head>
<body><th:block th:replace="~{fragments/layout :: shell('common-courses')}"></th:block>
<main class="page-main admin-content">
<h1>Commonly Attended Course Catalogue</h1>
<p><a th:href="@{/admin/common-courses/new}">Add Course</a></p>
<p role="status" th:if="${successMessage != null}" th:text="${successMessage}"></p>
<p role="alert" th:if="${errorMessage != null}" th:text="${errorMessage}"></p>
<p th:if="${#lists.isEmpty(commonCourses)}">No commonly attended courses found.</p>
<div class="table-scroll"><table th:unless="${#lists.isEmpty(commonCourses)}">
<thead><tr><th>ID</th><th>Title</th><th>Category</th><th>Training Provider</th><th>Reference Fee (S$)</th><th>Actions</th></tr></thead>
<tbody><tr th:each="course : ${commonCourses}">
<td th:text="${course.id}"></td><td th:text="${course.title}"></td><td th:text="${course.category.name}"></td>
<td th:text="${course.provider.name}"></td><td th:text="${course.fee}"></td>
<td><a th:href="@{/admin/common-courses/{id}/edit(id=${course.id})}">Edit</a>
<form th:action="@{/admin/common-courses/{id}/delete(id=${course.id})}" method="post"
onsubmit="return confirm('Remove this course from the catalogue?');"><button type="submit">Delete</button></form></td>
</tr></tbody></table></div>
</main></body></html>
