<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Commonly Attended Course Catalogue</title>
</head>
<body>

<h1>Commonly Attended Course Catalogue</h1>

<p>
    Commonly attended courses selected and maintained by administrators.
</p>

<p th:if="${successMessage != null}"
   th:text="${successMessage}">
</p>

<p th:if="${errorMessage != null}"
   th:text="${errorMessage}">
</p>

<p>
    <a th:href="@{/employee/home}">Back to Home</a>
</p>

<p>
    <a th:href="@{/admin/providers}">Training Provider Management</a>
</p>

<p>
    <a th:href="@{/admin/common-courses/new}">
        Add Commonly Attended Course
    </a>
</p>

<p th:if="${#lists.isEmpty(commonCourses)}">
    No commonly attended courses found.
</p>

<table border="1" th:if="${!#lists.isEmpty(commonCourses)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Category</th>
        <th>Training Provider</th>
        <th>Reference Fee (S$)</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="commonCourse : ${commonCourses}">
        <td th:text="${commonCourse.id}"></td>
        <td th:text="${commonCourse.title}"></td>
        <td th:text="${commonCourse.category}"></td>
        <td th:text="${commonCourse.provider.name}"></td>
        <td th:text="${commonCourse.fee}"></td>

        <td>
            <a th:href="@{/admin/common-courses/{id}/edit(id=${commonCourse.id})}">
                Edit
            </a>

            <form th:action="@{/admin/common-courses/{id}/delete(id=${commonCourse.id})}"
                  method="post"
                  onsubmit="return confirm('Are you sure you want to delete this commonly attended course?');">

                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
