<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Commonly Attended Course</title>
</head>
<body>

<h1>Edit Commonly Attended Course</h1>

<p th:if="${errorMessage != null}"
   th:text="${errorMessage}">
</p>

<p>
    <a th:href="@{/admin/common-courses}">
        Back to Commonly Attended Course Catalogue
    </a>
</p>

<p th:if="${#lists.isEmpty(providers)}">
    Please add a training provider before saving a course.
    <a th:href="@{/admin/providers/new}">Add Training Provider</a>
</p>

<form th:action="@{/admin/common-courses/{id}/update(id=${commonCourseId})}"
      th:object="${commonCourseForm}"
      method="post">

    <p>
        <label for="title">Course Title:</label>
        <input type="text"
               id="title"
               th:field="*{title}"
               maxlength="255"
               required>
    </p>

    <p>
        <label for="category">Category:</label>
        <select id="category" th:field="*{category}" required>
            <option value="">-- Select Category --</option>
            <option value="INTERNAL">INTERNAL</option>
            <option value="EXTERNAL">EXTERNAL</option>
            <option value="CERTIFICATION">CERTIFICATION</option>
        </select>
    </p>

    <p>
        <label for="providerId">Training Provider:</label>
        <select id="providerId" th:field="*{providerId}" required>
            <option value="">-- Select Training Provider --</option>

            <option th:each="provider : ${providers}"
                    th:value="${provider.id}"
                    th:text="${provider.name}">
            </option>
        </select>
    </p>

    <p>
        <label for="fee">Reference Fee (S$):</label>
        <input type="number"
               id="fee"
               th:field="*{fee}"
               min="0"
               step="0.01"
               required>
    </p>

    <p>Internal courses must have a fee of zero.</p>

    <p>
        <button type="submit"
                th:disabled="${#lists.isEmpty(providers)}">
            Save Changes
        </button>
    </p>

</form>

</body>
</html>
