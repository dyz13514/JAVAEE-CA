<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Common Course Selection</title>
    <th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/layout :: shell('common-courses')}"></th:block>
<main class="page-main admin-content">
    <h1>Change Common Course Selection</h1>
    <p><a th:href="@{/admin/common-courses}">Back to Commonly Attended Course Catalogue</a></p>
    <p>Select an existing course. Maintain its title, provider and reference fee in
        <a th:href="@{/admin/courses}">Course Management</a>.</p>
    <p role="alert" th:if="${errorMessage != null}" th:text="${errorMessage}"></p>
    <p th:if="${#lists.isEmpty(courses)}">No courses available.
        <a th:href="@{/admin/courses/new}">Add a course first</a>.</p>
    <form th:action="@{/admin/common-courses/{id}/update(id=${commonCourseId})}" th:object="${commonCourseForm}" method="post">
        <p>
            <label for="courseId">Course</label>
            <select id="courseId" th:field="*{courseId}" required>
                <option value="">-- Select Course --</option>
                <option th:each="course : ${courses}" th:value="${course.id}"
                        th:text="${course.title + ' — ' + course.provider.name + ' (ID: ' + course.id + ')'}"></option>
            </select>
        </p>
        <button type="submit" th:disabled="${#lists.isEmpty(courses)}">Save Selection</button>
    </form>
</main>
</body>
</html>
