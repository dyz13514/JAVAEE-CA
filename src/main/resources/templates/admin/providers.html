<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Training Provider Management</title>
<th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/layout :: shell('providers')}"></th:block>
<main class="page-main admin-content">

<div class="page-heading"><h1>Training Provider Management</h1><a class="primary-button" th:href="@{/admin/providers/new}">Add Training Provider</a></div>

<p role="status" th:if="${successMessage != null}"
   th:text="${successMessage}">
</p>

<p role="alert" th:if="${errorMessage != null}"
   th:text="${errorMessage}">
</p>

<p th:if="${#lists.isEmpty(providers)}">
    No training providers found.
</p>

<div class="table-scroll"><table th:if="${!#lists.isEmpty(providers)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="provider : ${providers}">
        <td th:text="${provider.id}"></td>
        <td th:text="${provider.name}"></td>

        <td>
            <a th:href="@{/admin/providers/{id}/edit(id=${provider.id})}">
                Edit
            </a>

            <form th:action="@{/admin/providers/{id}/delete(id=${provider.id})}"
                  method="post"
                  onsubmit="return confirm('Are you sure you want to delete this training provider?');">

                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table></div>

</main>
</body>
</html>
