<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>
<th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/layout :: shell('employees')}"></th:block>
<main class="page-main admin-content">

<h1>Add Employee</h1>

<p role="alert" th:if="${errorMessage != null}"
   th:text="${errorMessage}">
</p>

<p>
    <a th:href="@{/admin/employees}">Back to Employee List</a>
</p>

<form th:action="@{/admin/employees/save}"
      th:object="${employeeForm}"
      method="post">

    <p>
        <label for="username">Username:</label>
        <input type="text"
               id="username"
               th:field="*{username}"
               required>
    </p>

    <p>
        <label for="name">Name:</label>
        <input type="text"
               id="name"
               th:field="*{name}"
               required>
    </p>

    <p>
        <label for="password">Password:</label>
        <input type="password"
               id="password"
               th:field="*{password}"
               required>
    </p>

    <p>
        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" maxlength="254">
        <small>Used for course application notifications. Existing accounts may leave this blank.</small>
    </p>

    <p>
        <label for="role">Role:</label>
        <select id="role" th:field="*{role}" required>
            <option th:each="role : ${roles}"
                    th:value="${role}"
                    th:text="${role.name() == 'REGULAR_STAFF' ? 'Staff' : #strings.capitalize(#strings.toLowerCase(role.name()))}">
            </option>
        </select>
    </p>

    <p>
        <label for="designation">Designation:</label>
        <select id="designation" th:field="*{designation}" required>
            <option value="">-- Select Designation --</option>

            <option th:each="designation : ${designations}"
                    th:value="${designation}"
                    th:text="${#strings.capitalize(#strings.toLowerCase(designation.name()))}">
            </option>
        </select>
    </p>

    <p>
        <label for="supervisorId">Supervisor:</label>
        <select id="supervisorId" th:field="*{supervisorId}">
            <option value="">-- Not assigned --</option>

            <option th:each="manager : ${managers}"
                    th:value="${manager.id}"
                    th:text="${manager.name}">
            </option>
        </select>
    </p>

    <p>
        <button type="submit">Save Employee</button>
    </p>

</form>

</main>
</body>
</html>
