<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Training Provider</title>
<th:block th:replace="~{fragments/layout :: assets}"></th:block>
</head>
<body>
<th:block th:replace="~{fragments/layout :: shell('providers')}"></th:block>
<main class="page-main admin-content">

<h1>Edit Training Provider</h1>

<p role="alert" th:if="${errorMessage != null}"
   th:text="${errorMessage}">
</p>

<p>
    <a th:href="@{/admin/providers}">Back to Training Provider List</a>
</p>

<form th:action="@{/admin/providers/{id}/update(id=${providerId})}"
      method="post">

    <p>
        <label for="name">Provider Name:</label>
        <input type="text"
               id="name"
               name="name"
               th:value="${name}"
               maxlength="255"
               required>
    </p>

    <p>
        <button type="submit">Save Changes</button>
    </p>

</form>

</main>
</body>
</html>
