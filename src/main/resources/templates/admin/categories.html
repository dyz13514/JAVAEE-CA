<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"><title>Course Categories - CATS</title>
<th:block th:replace="~{fragments/layout :: assets}"></th:block></head>
<body><th:block th:replace="~{fragments/layout :: shell('categories')}"></th:block>
<main class="page-main admin-content">
<h1>Course Categories</h1>
<p><a th:href="@{/admin/categories/new}">Add Category</a></p>
<p>The original three names and half-day settings are fixed. Their descriptions can be edited.</p>
<p role="status" th:if="${successMessage != null}" th:text="${successMessage}"></p>
<p role="alert" th:if="${errorMessage != null}" th:text="${errorMessage}"></p>
<div class="table-scroll"><table>
<thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Half-day Allowed</th><th>Actions</th></tr></thead>
<tbody><tr th:each="category : ${categories}" th:with="fixed=${category.name == 'INTERNAL' or category.name == 'EXTERNAL' or category.name == 'CERTIFICATION'}">
<td th:text="${category.id}"></td><td th:text="${category.name}"></td><td th:text="${category.description}"></td>
<td th:text="${category.halfDayAllowed ? 'Yes' : 'No'}"></td>
<td><a th:href="@{/admin/categories/{id}/edit(id=${category.id})}">Edit</a>
<form th:unless="${fixed}" th:action="@{/admin/categories/{id}/delete(id=${category.id})}" method="post"
onsubmit="return confirm('Delete this category?');"><button type="submit">Delete</button></form></td>
</tr></tbody></table></div>
</main></body></html>
